# DocTrainAI Docker Compose 编排文件（仓库根目录）。
# 阶段 1：仅 PostgreSQL。阶段 2：在同一文件追加 redis、api、worker 等。
# 启动：在仓库根目录执行 docker compose up -d
# 停止：docker compose down（加 -v 会删除数据卷，慎用）

# 定义要运行的容器服务列表
services:
  # 服务名 postgres：docker compose 内其它服务用此名互联（如 api 里 DATABASE_HOST=postgres）
  postgres:
    # 镜像：PostgreSQL 16 + pgvector 扩展（阶段 1 不建向量列，阶段 2 直接用同一库）
    image: pgvector/pgvector:pg16
    # 固定容器名，便于 docker logs doctrainai-postgres 排查
    container_name: doctrainai-postgres
    # 除非手动 stop，否则 Docker 守护进程重启后自动拉起容器
    restart: unless-stopped
    # 端口映射：宿主机端口:容器端口。本机用 127.0.0.1:5432 连接
    ports:
      - '5432:5432'
    # 初始化数据库时的账号、密码、默认库名（须与 .env 中 DATABASE_URL 一致）
    environment:
      POSTGRES_USER: doctrain
      POSTGRES_PASSWORD: doctrain_dev
      POSTGRES_DB: doctrain
    # 数据目录挂载到命名卷，删容器不删数据；down -v 才会清空
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 健康检查：通过后 compose ps 显示 healthy，编排/探针可依赖
    healthcheck:
      # 在容器内执行 pg_isready，确认 Postgres 接受连接
      test: ['CMD-SHELL', 'pg_isready -U doctrain -d doctrain']
      # 每 5 秒检查一次
      interval: 5s
      # 单次检查最长等待 5 秒
      timeout: 5s
      # 连续失败 5 次才标记 unhealthy
      retries: 5

  # 服务名 redis：docker compose 内其它服务用此名互联（如 api 里 REDIS_HOST=redis）
  redis:
    # 镜像：Redis 7 + Alpine 镜像（小巧）
    image: redis:7-alpine
    # 固定容器名，便于 docker logs doctrainai-redis 排查
    container_name: doctrainai-redis
    # 除非手动 stop，否则 Docker 守护进程重启后自动拉起容器
    restart: unless-stopped
    # 端口映射：宿主机端口:容器端口。本机用 127.0.0.1:6379 连接
    ports:
      - '6379:6379'
    # 数据目录挂载到命名卷，删容器不删数据；down -v 才会清空
    volumes:
      - redis_data:/data
    # 健康检查：通过后 compose ps 显示 healthy，编排/探针可依赖
    healthcheck:
      # 在容器内执行 redis-cli ping，确认 Redis 接受连接
      test: ['CMD', 'redis-cli', 'ping']
      # 每 5 秒检查一次
      interval: 5s
      # 单次检查最长等待 5 秒
      timeout: 3s
      # 连续失败 5 次才标记 unhealthy
      retries: 5

# 声明命名卷（由 Docker 管理存储位置，通常在本机 Docker 数据目录）
volumes:
  # 卷名 postgres_data，与上方 services.postgres.volumes 引用一致
  postgres_data:
  # 卷名 redis_data，与上方 services.redis.volumes 引用一致
  redis_data:
