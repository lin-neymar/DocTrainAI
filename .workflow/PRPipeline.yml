version: '1.0'
name: pr-pipeline
displayName: PR 门禁

triggers:
  pr:
    branches:
      include:
        - master

stages:
  - stage: gates
    displayName: 全量门禁
    steps:
      - step: build@ci
        name: server-gate
        displayName: 后端门禁
        commands: |
          cd server
          python3 -m pip install -r requirements.txt --quiet
          python3 -m ruff check app tests
          python3 -m pytest -q

      - step: build@ci
        name: web-gate
        displayName: 前端门禁
        commands: |
          cd web
          npm ci
          npm run lint
          npx prettier --check .
          npm run build
