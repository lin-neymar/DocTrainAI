# 阶段 4：DocTrainAI web 反向代理（挂到 /etc/nginx/conf.d/default.conf）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 文档上传上限（与后端 FILE_MAX_MB 匹配，nginx 默认仅 1m，必须放开）
    client_max_body_size 25m;

    # SPA 前端路由：找不到文件时回落到 index.html（vue-router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代到 api 容器（compose 网络内主机名）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 三件套（对话流式接口）：关缓冲、禁缓存、放宽读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

# 阶段 4 预留：有域名与证书后启用 HTTPS——挂载证书并复制上面两个 location 即可
